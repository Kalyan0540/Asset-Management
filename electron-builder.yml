appId: cool.atlas.library
productName: Atlas
icon: build/icon.png
artifactName: Atlas-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - desktop-build/**
  - dist/**
  - package.json
  - '!node_modules/**'
extraResources:
  - from: desktop-build
    to: agent
    filter: ['entry.mjs', 'mcp.mjs']
  - from: desktop-build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
  identity: '-'
  hardenedRuntime: false
dmg:
  sign: false
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage]
  category: Graphics
