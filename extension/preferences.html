<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Capture Preferences</title>
    <link rel="stylesheet" href="capture.css" />
    <script type="module" src="preferences.js"></script>
  </head>
  <body class="document preferences">
    <header>
      <span class="mark" aria-hidden="true">A</span>
      <div><strong>Atlas Capture</strong><small>Preferences</small></div>
    </header>
    <main>
      <form id="pair" class="box">
        <h1>Connect to Atlas</h1>
        <p>
          Open Atlas, then choose <strong>Browser Capture → Copy Pairing Key</strong>. Paste it here
          to save to your active library.
        </p>
        <label for="key">Pairing key</label>
        <input
          id="key"
          type="password"
          placeholder="Paste your Atlas key"
          autocomplete="off"
          minlength="64"
          maxlength="64"
        />
        <div class="button-row">
          <button class="primary" type="submit">Connect</button
          ><button class="subtle" id="disconnect" type="button">Disconnect</button>
        </div>
        <p id="pair-status" role="status" aria-live="polite"></p>
      </form>
      <section class="box" aria-label="Capture settings">
        <h2>Capture settings</h2>
        <label for="theme">Appearance</label>
        <select id="theme">
          <option value="system">Follow system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <label for="tags">Default tags</label>
        <input id="tags" type="text" maxlength="520" placeholder="Inspiration, references" />
        <small>Use commas to separate tags.</small>
        <label class="check"
          ><input id="drag" type="checkbox" /> Drop zone for images and links</label
        >
        <label class="check"
          ><input id="doubleClick" type="checkbox" /> Show a save action on double-clicked
          text</label
        >
        <small>Choose Enable page tools from the popup to use these on the current page.</small>
      </section>
    </main>
  </body>
</html>
