name: Build Android preview
on:
  push:
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', 'server/**', 'shared/**', 'scripts/transfer-fixture.ts', 'scripts/test-android-preview.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare desktop interoperability fixture
        run: node --import tsx scripts/transfer-fixture.ts create
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atlas-android-preview-key-v1
      - name: Compile and lint
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline library and native launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/test-android-preview.sh
      - name: Prepare APK
        run: |
          mkdir -p android/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk android/downloads/Atlas-0.4.1-android-preview.apk
          cd android/downloads
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-preview
          path: android/downloads/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-evidence
          path: |
            android/app/build/reports/
            android/atlas-android.png
  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-Android-preview
          path: downloads
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Atlas Android 0.4 preview" --prerelease --notes-file docs/ANDROID.md downloads/*
